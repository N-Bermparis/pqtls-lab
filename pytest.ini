[pytest]
testpaths = tests/integration tests/interoperability
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -r a: report ALL outcomes, including skips, at the end of a run.
#
# This is deliberate and load-bearing. A capability-gated post-quantum test that
# skips must be visible in the summary; a run that quietly skips half the suite
# and prints "passed" would be exactly the kind of hidden skip this project
# forbids (spec section 16).
addopts =
    -ra
    --strict-markers
    --tb=short
    --durations=10

markers =
    requires_pq: needs post-quantum TLS groups in the runtime OpenSSL
    requires_mldsa: needs ML-DSA post-quantum signature support
    slow: takes more than a few seconds

filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:_pytest.*
